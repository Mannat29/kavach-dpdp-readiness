# Retention/erasure policy per source for customer/patient erasure requests
# decisions: ERASE | MASK | RETAIN | REVIEW
# verify: true means output must be reviewed by a human before execution

sources:
  appointments_form.csv:
    default_decision: ERASE
    reason_code: APPT_ERASE
    citation_hint: "DPDP Act s.8(7) and s.12(3) - erasure when purpose no longer served or on request (verify against official text)"
    verify: false
    fields:
      Timestamp: {decision: ERASE, reason_code: APPT_ERASE, citation_hint: "row sent by data principal, no longer needed"}
      Name: {decision: ERASE, reason_code: APPT_ERASE}
      Phone: {decision: ERASE, reason_code: APPT_ERASE}
      Email: {decision: ERASE, reason_code: APPT_ERASE}
      Reason: {decision: ERASE, reason_code: APPT_ERASE}
    notes: "Erase entire row sent by the data principal"

  whatsapp_chat.txt:
    default_decision: ERASE
    reason_code: CHAT_ERASE
    citation_hint: "DPDP Act s.8(7) and s.12(3) - erasure when purpose no longer served or on request (verify against official text)"
    verify: false
    notes: "Erase lines SENT by the data principal; mask identifiers appearing in other people's lines"
    sent_by_principal: ERASE
    identifiers_in_others_lines: MASK

  patients.xlsx:
    default_decision: RETAIN
    reason_code: PATIENT_RETAIN_REVIEW
    citation_hint: "Retention subject to applicable medical/clinical-establishment record rules and s.8(7) 'unless law requires retention'; verify with a professional"
    verify: true
    fields:
      Phone: {decision: ERASE, reason_code: PATIENT_ID_ERASE, citation_hint: "identifier; no legal basis for retention", verify: false}
      Email: {decision: ERASE, reason_code: PATIENT_ID_ERASE, citation_hint: "identifier; no legal basis for retention", verify: false}
      Aadhaar: {decision: ERASE, reason_code: PATIENT_ID_ERASE, citation_hint: "identifier; no legal basis for retention", verify: false}
      DOB: {decision: ERASE, reason_code: PATIENT_ID_ERASE, citation_hint: "identifier; no legal basis for retention", verify: false}
      Name: {decision: ERASE, reason_code: PATIENT_ID_ERASE, citation_hint: "identifier; no legal basis for retention", verify: false}
      test_name: {decision: RETAIN, reason_code: MEDICAL_RECORD_RETAIN, citation_hint: "medical record retention, needs professional review (verify)", verify: true}
      notes: {decision: RETAIN, reason_code: MEDICAL_RECORD_RETAIN, citation_hint: "medical record retention, needs professional review (verify)", verify: true}
      Test Name: {decision: RETAIN, reason_code: MEDICAL_RECORD_RETAIN, citation_hint: "medical record retention, needs professional review (verify)", verify: true}
      Notes: {decision: RETAIN, reason_code: MEDICAL_RECORD_RETAIN, citation_hint: "medical record retention, needs professional review (verify)", verify: true}

  billing.csv:
    default_decision: RETAIN
    reason_code: BILLING_RETAIN
    citation_hint: "Retention period set by applicable tax/accounting law; verify the period"
    verify: true
    fields:
      invoice_no: {decision: RETAIN, reason_code: BILLING_RETAIN, citation_hint: "tax/accounting record retention, verify period"}
      amount: {decision: RETAIN, reason_code: BILLING_RETAIN, citation_hint: "tax/accounting record retention, verify period"}
      gstin: {decision: RETAIN, reason_code: BILLING_RETAIN, citation_hint: "tax/accounting record retention, verify period"}
      patient_name: {decision: RETAIN, reason_code: BILLING_RETAIN, citation_hint: "tax/accounting record retention, verify period"}
      phone: {decision: MASK, reason_code: BILLING_PHONE_MASK, citation_hint: "phone not required for tax records; mask to reduce risk"}

  staff.csv:
    default_decision: RETAIN
    reason_code: STAFF_RETAIN
    citation_hint: "Employment basis DPDP Act s.7(i); outside scope of customer erasure request"
    verify: false
    notes: "Staff records are outside scope of customer/patient erasure requests"
